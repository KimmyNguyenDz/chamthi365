<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ccfff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chamthi365">
<meta name="description" content="Chấm phiếu trắc nghiệm bằng điện thoại — Chamthi365">
<link rel="icon" href="/logo365.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/logo365.svg" as="image" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap" rel="stylesheet">
<title>Chamthi365</title>
<style>
#man-chao {
  position: fixed; inset: 0; z-index: 9999; overflow: hidden; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 0; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  background: linear-gradient(180deg, #7ccfff 0%, #a8e0ff 42%, #d4f1ff 100%);
  color: #1f2544; font-family: 'Baloo 2', system-ui, sans-serif; text-align: center;
  transition: opacity .5s ease, transform .5s ease; -webkit-user-select: none; user-select: none;
}
#man-chao.tat { opacity: 0; transform: scale(1.04); pointer-events: none; }
#man-chao .ly { position: absolute; left: 0; right: 0; bottom: 0; }
#man-chao .far { height: 42vh; background: radial-gradient(ellipse 90% 55% at 50% 115%, rgba(255,255,255,.7), transparent 70%); opacity:.55; }
#man-chao .mid { height: 26vh; background: radial-gradient(ellipse 120% 100% at 20% 120%, #8fd3a8 0%, transparent 62%), radial-gradient(ellipse 110% 95% at 85% 125%, #6fc794 0%, transparent 60%); opacity: .8; animation: mc-troi 1.2s cubic-bezier(.2,.8,.2,1) both; }
#man-chao .near { height: 18vh; background: radial-gradient(ellipse 130% 105% at 55% 125%, #4fb07c 0%, transparent 65%); opacity: .8; animation: mc-troi 1s .1s cubic-bezier(.2,.8,.2,1) both; }
#man-chao .giua { position: relative; display: flex; flex-direction: column; align-items: center; margin-top: -8vh; }
#man-chao .logo { position: relative; width: min(46vw, 210px); aspect-ratio: 340 / 335; animation: mc-hien .75s cubic-bezier(.34,1.56,.64,1) both; }
#man-chao .logo img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 6px 0 rgba(31,37,68,.28)); animation: mc-nhun 3.2s 1s ease-in-out infinite; }
#man-chao .sang { position: absolute; inset: 0; overflow: hidden; pointer-events: none; animation: mc-nhun 3.2s 1s ease-in-out infinite;
  -webkit-mask: url(/logo365.svg) center / contain no-repeat; mask: url(/logo365.svg) center / contain no-repeat; }
#man-chao .sang::before { content: ''; position: absolute; top: -10%; bottom: -10%; left: -70%; width: 60%;
  background: linear-gradient(105deg, transparent 20%, rgba(255,255,255,.95) 50%, transparent 80%); animation: mc-luot 1.1s .7s ease-in-out both; }
#man-chao .sao { position: absolute; width: 15%; aspect-ratio: 1; background: #fff; opacity: 0;
  clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
  filter: drop-shadow(0 0 4px #fff6c9); animation: mc-sao 1.4s ease-in-out infinite; }
#man-chao .s1 { left: 6%; top: 2%; animation-delay: .9s; } #man-chao .s2 { left: 74%; top: -4%; width: 11%; animation-delay: 1.25s; }
#man-chao .s3 { left: 92%; top: 34%; width: 10%; animation-delay: 1.6s; } #man-chao .s4 { left: -6%; top: 44%; width: 9%; animation-delay: 1.1s; }
#man-chao .ten { margin-top: 14px; font-weight: 800; font-size: clamp(36px, 10vw, 52px); line-height: 1; color: #fff;
  -webkit-text-stroke: 8px #1f2544; paint-order: stroke fill; text-shadow: 0 5px 0 #1f2544; animation: mc-len .6s .3s cubic-bezier(.2,.8,.2,1) both; }
#man-chao .phu { margin-top: 6px; font-weight: 800; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: #1f2544; animation: mc-len .6s .42s cubic-bezier(.2,.8,.2,1) both; }
#man-chao .chao { margin-top: 18px; padding: 8px 20px; border: 3px solid #1f2544; border-radius: 999px; background: #ffcf3f; box-shadow: 0 5px 0 #1f2544;
  font-weight: 800; font-size: 18px; line-height: 1.2; animation: mc-hien .6s .62s cubic-bezier(.34,1.56,.64,1) both; }
#man-chao .thanh { margin-top: 26px; width: 150px; height: 10px; border: 3px solid #1f2544; border-radius: 99px; background: #fff; overflow: hidden; animation: mc-len .5s .75s ease both; }
#man-chao .thanh i { display: block; height: 100%; width: 100%; background: #36c46b; transform-origin: left; animation: mc-chay 1.6s .8s cubic-bezier(.4,0,.2,1) both; }
#man-chao .chan { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); font-family: 'Be Vietnam Pro', system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 700; font-size: 13px; color: #1f2544; animation: mc-len .6s .9s ease both; }
#man-chao .chan .tgn { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; opacity: .7; }
@keyframes mc-hien { 0% { opacity: 0; transform: scale(.45) rotate(-6deg); } 100% { opacity: 1; transform: none; } }
@keyframes mc-len { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: none; } }
@keyframes mc-troi { 0% { transform: translateY(40%); } 100% { transform: none; } }
@keyframes mc-nhun { 50% { transform: translateY(-3%) rotate(-1.2deg); } }
@keyframes mc-luot { 0% { left: -70%; } 100% { left: 115%; } }
@keyframes mc-sao { 0%, 100% { opacity: 0; transform: scale(.3) rotate(0); } 45% { opacity: 1; transform: scale(1) rotate(45deg); } 75% { opacity: 0; transform: scale(.4) rotate(90deg); } }
@keyframes mc-chay { 0% { transform: scaleX(0); } 100% { transform: scaleX(1); } }
@media (max-height: 520px) { #man-chao .logo { width: min(26vh, 150px); } #man-chao .giua { margin-top: 0; } #man-chao .chao { margin-top: 10px; } #man-chao .thanh { margin-top: 14px; } }
@media (prefers-reduced-motion: reduce) { #man-chao *, #man-chao *::before { animation: none !important; } #man-chao .sao { display: none; } }
</style>
<link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<div id="man-chao" aria-hidden="true">
  <div class="ly far"></div><div class="ly mid"></div><div class="ly near"></div>
  <div class="giua">
    <div class="logo"><img src="/logo365.svg" alt=""><span class="sang"></span><i class="sao s1"></i><i class="sao s2"></i><i class="sao s3"></i><i class="sao s4"></i></div>
    <div class="ten">Chamthi365</div>
    <div class="phu">Chấm phiếu trắc nghiệm</div>
    <div class="chao">Chào mừng quý thầy cô</div>
    <div class="thanh"><i></i></div>
  </div>
  <div class="chan"><span class="tgn">Chamthi365</span><b>Chấm bài mỗi ngày</b></div>
</div>
<script>
(function () {
  var el = document.getElementById('man-chao'), t0 = Date.now(), xong = false;
  var nhanh = false;
  try { nhanh = localStorage.getItem('cp-khong-chao') === '1'; } catch (e) {}
  var giam = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var it = nhanh ? 0 : giam ? 700 : 1700;
  function bo() {
    if (xong) return; xong = true;
    window.__cpChaoXong = true;
    dispatchEvent(new Event('cp:chao-xong'));
    if (!el) return;
    if (nhanh) { el.remove(); return; }
    el.classList.add('tat');
    setTimeout(function () { el.remove(); }, 550);
  }
  if (nhanh) bo();
  window.__cpChaoTat = function () { setTimeout(bo, Math.max(0, it - (Date.now() - t0))); };
  setTimeout(bo, 8000);
})();
</script>
<div id="app"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
